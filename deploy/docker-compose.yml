# 单机部署（推荐给个人用户）：一个容器跑完，前端由 Go 服务同源托管。
# 集群部署见 docs/design/08-infra.md §2.2。
services:
  ic:
    image: ${IC_IMAGE:-registry.example.com/ic:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    environment:
      IC_MODE: standalone
      IC_DB_DSN: "file:/data/ic.db?_pragma=journal_mode(WAL)&_pragma=busy_timeout(5000)"
      IC_BLOB_DRIVER: fs
      IC_BLOB_FS_ROOT: /data/assets
      # 必填：32 字节 base64/hex。生成方式：openssl rand -base64 32
      IC_SECRET_KEY: ${IC_SECRET_KEY:?IC_SECRET_KEY is required}
      IC_ALLOW_REGISTRATION: ${IC_ALLOW_REGISTRATION:-true}
      IC_LOG_LEVEL: ${IC_LOG_LEVEL:-info}
      IC_LOG_FORMAT: json
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/ic-server", "-version"]
      interval: 30s
      timeout: 5s
      retries: 3
