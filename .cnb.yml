# IC 重写 · CI 与上游巡检
# 设计说明：docs/design/12-legacy-and-upstream.md、docs/design/13-verification-and-iteration.md

main:
  # 每周一 03:00（UTC）巡检上游「契约面」变化，产出报告与待办（不自动改代码）
  "crontab: 0 3 * * 1":
    - name: upstream-watch
      docker:
        image: node:22
      env:
        UPSTREAM_REPO: https://github.com/basketikun/infinite-canvas.git
        UPSTREAM_REF: main
      stages:
        - name: 抽取上游契约面变化
          script: |
            set -euo pipefail
            bash scripts/upstream-sync.sh || true
            echo "---- change-report 摘要 ----"
            node -e "
              const fs = require('fs');
              const p = 'upstream/change-report.json';
              if (!fs.existsSync(p)) { console.log('无报告（上游未变化）'); process.exit(0); }
              const r = JSON.parse(fs.readFileSync(p, 'utf8'));
              console.log('verdict:', r.verdict);
              console.log('from   :', r.from.version, r.from.commit);
              console.log('to     :', r.to.version, r.to.commit);
              const probes = r.probes || {};
              for (const key of Object.keys(probes)) {
                const value = probes[key];
                if (Array.isArray(value) && value.length) console.log(key, '=>', value.slice(0, 20));
                else if (key === 'limitsChanged' && Array.isArray(value) && value.length) console.log(key, '=>', value);
              }
            "

  # PR / 推送门禁：lint → test → 边界/对等/安全 → 故障演练
  "**":
    - name: gate
      docker:
        image: golang:1.24
      stages:
        - name: 静态检查
          script: |
            set -euo pipefail
            go vet ./...
            gofmt -l . | tee /tmp/fmt.txt
            test ! -s /tmp/fmt.txt || (echo "以下文件未格式化：" && cat /tmp/fmt.txt && exit 1)

        - name: 单元测试与对抗用例
          script: |
            set -euo pipefail
            go test ./... -count=1 -timeout 300s

        - name: 边界常量一致性
          script: node scripts/check-boundaries.mjs

        - name: 节点 schema 前后端一致性
          script: node scripts/check-node-schema.mjs

        - name: 对等矩阵覆盖率报告
          script: node scripts/parity-report.mjs

        - name: 安全门禁
          script: |
            set -euo pipefail
            go test ./internal/platform/ -run 'TestRedact|TestSSRF|TestDrill' -count=1
            go test ./internal/plugin/ -run 'TestATK09|TestSandbox|TestNetwork|TestInstallRejectsPermission' -count=1
            go test ./internal/asset/ -run 'TestATK05|TestUploadSanitizes|TestCrossWorkspace' -count=1
            node scripts/check-secrets.mjs

        - name: 故障演练子集
          script: |
            set -euo pipefail
            go test ./internal/graph/ -run 'TestVersionConflict|TestRebaseable|TestATK21' -count=1
            go test ./internal/exec/ -run 'TestATK15|TestResume|TestCancel|TestPartialFailure' -count=1
            go test ./internal/asset/ -run 'TestGC' -count=1

$:
  # 手动触发：按需巡检上游
  web_trigger_upstream:
    - name: upstream-watch-manual
      docker:
        image: node:22
      env:
        UPSTREAM_REPO: https://github.com/basketikun/infinite-canvas.git
        UPSTREAM_REF: main
      stages:
        - name: 抽取上游契约面变化
          script: |
            set -euo pipefail
            bash scripts/upstream-sync.sh || true
            test -f upstream/change-report.json && cat upstream/change-report.json || echo "上游未变化"

  # 手动触发：前端构建与检查（需要 node 环境）
  web_trigger_frontend:
    - name: frontend-check
      docker:
        image: node:22
      stages:
        - name: 安装依赖
          script: |
            set -euo pipefail
            cd web && corepack enable && (pnpm install --frozen-lockfile || pnpm install)
        - name: 类型检查与单测
          script: |
            set -euo pipefail
            cd web && pnpm exec tsc --noEmit && pnpm exec vitest run
        - name: 生产构建
          script: |
            set -euo pipefail
            cd web && pnpm build
        - name: 内核纯度检查
          script: node scripts/check-kernel-purity.mjs
